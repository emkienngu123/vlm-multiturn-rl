[project]
name = "vlm-multiturn-rl"
version = "0.1.0"
description = "Multi-turn vision-language agents with LoRA SFT, GRPO, and reproducible GPU experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal==1.6.2",
]

[project.scripts]
vlm-multiturn-rl = "vlm_multiturn_rl:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
